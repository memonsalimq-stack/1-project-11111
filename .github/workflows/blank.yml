name: DragonEngine APK Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare log folder
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project zip
        id: unzip
        run: |
          set -eo pipefail
          zip=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$zip" ]; then
            echo "ERROR: repo mein koi .zip file nahi mili."
            find . -maxdepth 2 -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "Using zip: $zip"
          rm -rf "$RUNNER_TEMP/proj"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$zip" -d "$RUNNER_TEMP/proj"
          gw=$(find "$RUNNER_TEMP/proj" -maxdepth 4 -name gradlew | head -n 1)
          if [ -z "$gw" ]; then
            echo "ERROR: zip ke andar gradlew nahi mila."
            find "$RUNNER_TEMP/proj" -maxdepth 3 | head -50
            exit 1
          fi
          dir=$(dirname "$gw")
          chmod +x "$gw"
          echo "Gradle project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK components
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes | "$SDKMANAGER" --licenses > /dev/null; } || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" 2>&1 | tee "$LOGS/sdkmanager.log"

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$LOGS/gradle.log"

      - name: Show errors on the summary page
        if: always()
        run: |
          for f in sdkmanager gradle; do
            log="$LOGS/$f.log"
            [ -f "$log" ] || continue
            {
              echo "### $f.log (last 80 lines)"
              echo '```'
              tail -n 80 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -E "error:|FAILED|What went wrong|Execution failed|ERROR|Exception|not found|No such file" "$log" | head -n 12 | cut -c1-300 | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$f errors::$msg"
          done
          true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonEngine-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
