
name: DragonEngine APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888"

      - name: Extract Project ZIP
        run: |
          unzip -q DragonEngine_v3.zip -d extracted
          ls extracted/DragonEngine

      - name: Build DragonEngine APK
        working-directory: extracted/DragonEngine
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonEngine-APK
          path: extracted/DragonEngine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
