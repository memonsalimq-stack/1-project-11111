name: DragonEngine APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches downloaded dependencies between runs (fewer requests to Maven Central).
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Maven Central sometimes answers 429 (Too Many Requests) on shared CI addresses.
      # Retry with a growing pause instead of failing the whole job.
      - name: Build debug APK
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Attempt $i failed, retrying in $((i*45)) seconds"
            sleep $((i*45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: DragonEngine-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/cxx/Debug/*/obj/local/arm64-v8a/libDARK_OWNER.so
          if-no-files-found: warn
          
